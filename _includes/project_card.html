<div class="group rounded-2xl bg-white p-5 shadow-sm hover:shadow-xl transition-all duration-500 h-full flex flex-col border border-gray-100 hover:border-gray-200 hover:-translate-y-1">
  <a href="{{include.project.url | relative_url}}" class="flex flex-col h-full">
    <div class="relative overflow-hidden rounded-xl">
      <img src="{{include.project.image | relative_url}}" alt="{{include.project.title}}" class="object-cover w-full h-40 md:h-44 transition-transform duration-500 group-hover:scale-105" />
      <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
    </div>
    <p class="font-mulish text-sky-600 mt-4 mb-1 text-xs font-semibold tracking-wider">{{include.project.category | upcase}}</p>
    <h2 class="text-lg md:text-xl font-bold my-1 text-gray-900 line-clamp-2 group-hover:text-sky-600 transition-colors duration-300">{{include.project.title}}</h2>
    <div class="font-mulish text-sm line-clamp-2 flex-grow text-gray-500 leading-relaxed">
      {{include.project.excerpt}}
    </div>
    <div class="mt-4 pt-4 border-t border-gray-100 flex flex-wrap gap-2">
      {% for tag in include.project.tags %}
      <span class="font-mulish text-xs text-gray-400 bg-gray-50 px-2 py-0.5 rounded-full">#{{ tag | xml_escape }}</span>
      {% endfor %}
    </div>
  </a>
</div>
