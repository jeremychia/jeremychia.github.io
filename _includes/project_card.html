<div class="group rounded-xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 hover:border-gray-300 dark:hover:border-slate-600 transition-all duration-300 h-full flex flex-col overflow-hidden">
  <a href="{{include.project.url | relative_url}}" class="flex flex-col h-full">
    <div class="relative overflow-hidden">
      <img src="{{include.project.image | relative_url}}" alt="{{include.project.title}}" class="object-cover w-full h-40 transition-transform duration-300 group-hover:scale-105" />
    </div>
    <div class="p-5 flex flex-col flex-grow">
      <div class="flex items-center gap-2 mb-2">
        <span class="text-xs font-medium text-sky-600 dark:text-sky-400">{{include.project.category | upcase}}</span>
      </div>
      <h2 class="text-lg font-semibold text-gray-900 dark:text-white group-hover:text-sky-600 dark:group-hover:text-sky-400 transition-colors line-clamp-2 mb-2">{{include.project.title}}</h2>
      <p class="text-sm text-gray-600 dark:text-slate-400 line-clamp-2 flex-grow">
        {{include.project.excerpt | strip_html | truncate: 120}}
      </p>
      <div class="mt-4 pt-4 border-t border-gray-100 dark:border-slate-700 flex flex-wrap gap-1.5">
        {% for tag in include.project.tags limit:4 %}
        <span class="px-2 py-0.5 text-xs font-mono bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-slate-400 rounded">{{ tag }}</span>
        {% endfor %}
      </div>
    </div>
  </a>
</div>
