<div class="rounded-lg hover:bg-gray-50 p-4 md:p-8 shadow h-full flex flex-col">
  <a href="{{include.post.url | relative_url}}" class="flex flex-col h-full">
    <img src="{{include.post.image | relative_url}}" alt="{{include.post.title}}" class="object-cover w-full h-48 rounded hover:opacity-90 transition duration-300" />
    <p class="venue-pills mt-4 mb-2"><span class="venue-pill">{{ include.post.categories[0] | capitalize }}</span></p>
    {% assign card_h = include.heading | default: "h2" %}<{{ card_h }} class="text-xl hover:underline font-bold my-2 text-gray-800">{{include.post.title}}</{{ card_h }}>
    <div class="flex-grow"></div>
    <span class="font-mulish text-sm text-gray-500 mt-6">
      {{ include.post.date | date: "%-d %B %Y" }}
    </span>
  </a>
</div>
