<div class="group flex flex-col h-full">
  <a href="{{include.post.url | relative_url}}" aria-label="{{include.post.title}}" class="block">
    <div class="relative overflow-hidden rounded-lg">
      <div class="w-full h-44 bg-cover bg-center transition-transform duration-300 group-hover:scale-105"
        style="background-image: url('{{include.post.image | default: '/assets/images/main.avif' | relative_url}}')"></div>
    </div>
  </a>
  <div class="pt-4 flex flex-col flex-grow">
    <a href="{{site.url}}{{site.baseurl}}/category/{{include.post.categories[0] | replace: ' ', '-'| downcase}}"
      aria-label="Category {{include.post.categories[0]}} url"
      class="text-xs font-medium text-sky-600 dark:text-sky-400 hover:underline">
      {{ include.post.categories[0] | upcase }}
    </a>
    <a href="{{include.post.url | relative_url}}" aria-label="{{include.post.title}}">
      <h2 class="font-semibold text-lg text-gray-900 dark:text-white mt-2 line-clamp-2 group-hover:text-sky-600 dark:group-hover:text-sky-400 transition-colors">{{include.post.title}}</h2>
    </a>
    <span class="text-sm text-gray-500 dark:text-slate-400 mt-auto pt-3">
      {{ include.post.date | date: "%b %-d, %Y" }}
    </span>
  </div>
</div>
