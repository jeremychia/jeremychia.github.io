<div class="group rounded-xl border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800/50 hover:border-gray-300 dark:hover:border-slate-600 transition-all duration-300 p-5">
  <a href="{{include.publication.url | relative_url}}" class="block">
    <p class="text-xs font-medium text-sky-600 dark:text-sky-400 mb-2">{{include.publication.venue | upcase}}</p>
    <h2 class="text-lg font-semibold text-gray-900 dark:text-white group-hover:text-sky-600 dark:group-hover:text-sky-400 transition-colors line-clamp-2 mb-3">{{include.publication.title}}</h2>
    <p class="text-sm text-gray-600 dark:text-slate-400 line-clamp-3">
      {{include.publication.excerpt}}
    </p>
    <div class="mt-4 pt-3 border-t border-gray-100 dark:border-slate-700 flex flex-wrap gap-1.5">
      {% for tag in include.publication.tags %}
      <span class="px-2 py-0.5 text-xs font-mono bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-slate-400 rounded">{{ tag }}</span>
      {% endfor %}
    </div>
  </a>
</div>
