<div class="group rounded-2xl bg-white p-6 shadow-sm hover:shadow-xl transition-all duration-500 border border-gray-100 hover:border-gray-200 hover:-translate-y-1">
  <a href="{{include.publication.url | relative_url}}" class="block">
    <div class="flex items-center gap-3 mb-4">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-400 to-blue-500 flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      </div>
      <p class="font-mulish text-sky-600 text-xs font-semibold tracking-wider">{{include.publication.venue | upcase}}</p>
    </div>
    <h2 class="text-xl md:text-2xl font-bold my-2 text-gray-900 group-hover:text-sky-600 transition-colors duration-300">{{include.publication.title}}</h2>
    <div class="font-mulish text-gray-500 mt-3 leading-relaxed line-clamp-3">
      {{include.publication.excerpt}}
    </div>
    <div class="mt-4 pt-4 border-t border-gray-100 flex flex-wrap gap-2">
      {% for tag in include.publication.tags %}
      <span class="font-mulish text-xs text-gray-400 bg-gray-50 px-2 py-0.5 rounded-full">#{{ tag | xml_escape }}</span>
      {% endfor %}
    </div>
  </a>
</div>
