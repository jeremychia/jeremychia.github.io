manifesto:
  quote: "Energised by solving hard problems well."
  subtitle: "Structure life to maximise time on actual work, minimise politics and consensus-building."
  chips:
    - "ISTP"
    - "Directing Reformer"

personality:
  section_label: "Personality at a glance"
  attribution: "Insights Discovery · Color Dynamics · ISTP"
  traits:
    - label: "Analytical"
      description: "Structured, quality-focused. Thinks in systems and standards. Values process integrity and thorough reasoning."
      color: "#3b82f6"
      text_color: "#2563eb"
    - label: "Decisive"
      description: "Direct and action-oriented. Comfortable making tough calls when the logic is sound."
      color: "#ef4444"
      text_color: "#dc2626"
    - label: "Caring"
      description: "Quietly invested. Shows care through reliability and honest feedback, not constant availability or warmth performance."
      color: "#22c55e"
      text_color: "#16a34a"
    - label: "Not expressive"
      description: "Prefers depth and directness to social performance or charm-led collaboration. Doesn't do small talk for its own sake."
      color: "#d1d5db"
      text_color: "#9ca3af"

tabs:
  how_i_work: "How I Work"
  values: "Values"
  energisers: "Energisers"
  working_with_me: "Working With Me"

how_i_work:
  cards:
    - title: "Team Dynamics"
      accent: "blue"
      points:
        - "Best in teams of 5–15: large enough for hard problems, small enough to maintain shared standards"
        - "Natural role: problem solver + standard-setter + quiet supporter"
        - "Collaborative on hard problems, not consensus-seeking — works best with 1–2 peers to debate with"
        - "Shows care through reliability and honest feedback, not constant warmth"
      link_tab: "values"
      link_label: "→ connects to Values: Merit-based"
    - title: "Under Pressure"
      accent: "red"
      points:
        - "Moderate pressure sharpens focus — stress clarifies thinking and prioritisation"
        - "Extreme pressure: brief withdrawal to reset, then reengage. Quiet ≠ giving up"
        - "Needs: clear escalation paths, autonomy to decide fast, minimal process overhead"
        - "Needs downtime afterward to recharge"
      link_tab: "working-with-me"
      link_label: "→ connects to How to manage"
    - title: "Handling Ambiguity"
      accent: "blue"
      points:
        - "Immediately tries to narrow it — asks clarifying questions, proposes structure, locks down constraints"
        - "Needs some guardrails: total open-endedness is paralyzing; defined problem space even if solution is open"
        - "May seem impatient with exploration — prefers \"here's what we should test\" over open brainstorming"
      link_tab: "energisers"
      link_label: "→ connects to Energisers: Drains"
    - title: "Stakeholders"
      accent: "green"
      points:
        - "Direct and efficient: tells stakeholders what I think and why; won't pretend a bad solution is good"
        - "Drains over time — needs technical work and solitude to recharge"
        - "Understands the problem they're solving first, then finds where interests align before pushing back"
      link_tab: "working-with-me"
      link_label: "→ connects to How I come across"
  leader:
    title: "As a Leader"
    col1:
      - "Sets crisp expectations; makes trade-offs and scope explicit"
      - "Advocates fiercely for team accomplishments; won't let good work go unrecognised"
      - "Stays hands-on in domain — leads through technical judgment, not pure delegation"
    col2:
      - "Matches people to problems based on what actually motivates them"
      - "Protects focus time; actively removes obstacles: meetings, vague roadmaps, politics"
      - "Not: motivational speaker, conflict smoother, culture-through-outings builder"
    link_tab: "working-with-me"
    link_label: "→ connects to Pitfalls: Directness without context"

values:
  non_negotiables_title: "Non-negotiables"
  non_negotiables_note: "Optics-first culture is a hard exit. Merit judged on results, not tenure or relationships."
  pills:
    - "Truth over politics"
    - "Merit-based advancement"
    - "Clear expectations"
    - "Autonomy to do it right"
    - "Investing in practitioners"
    - "Impact at scale"
  green_flags_title: "Green flags"
  green_flags:
    - "Technical depth valued; celebrates shipping good solutions"
    - "\"Here's the outcome, figure out how\" autonomy + clear goals"
    - "Leadership reasons through trade-offs openly, not by consensus"
    - "Free-flowing feedback; disagreement welcomed; directness valued"
    - "High bar for quality; leadership distinguishes reversible vs irreversible decisions"
    - "Servant leadership: leaders invest in reports' craft and career growth"
  red_flags_title: "Red flags"
  red_flags:
    - "Managers who can't handle disagreement"
    - "Decision-by-committee; constant scope re-negotiation"
    - "Quantity over quality; technical debt as normal"
    - "Feedback-avoidance; everyone supportive instead of honest"
    - "Vague expectations; undefined success metrics"
  compat_title: "How we might work together"
  compat_subtitle: "Things I've found tend to matter for collaboration to go well — for both sides. Not a checklist of demands, just signals worth exploring in a conversation."
  compat_items:
    - "Technical depth is valued and celebrated"
    - "Autonomy with clear goals — \"figure out how\" culture"
    - "Leadership reasons through trade-offs openly"
    - "Direct feedback welcomed; disagreement is fine"
    - "High bar for quality over pure velocity"
    - "Merit-based — results over relationships"
    - "Investment in practitioners' craft and growth"
    - "Measurable impact — not theatre or make-work"
  compat_labels:
    - "See which resonate — no right answer."
    - "A starting point."
    - "Some overlap."
    - "Worth a conversation."
    - "Reasonable fit."
    - "Good alignment on the things that matter."
    - "Sounds like a good match."
    - "Strong overlap — let's talk."
    - "Strong overlap — let's talk."

energisers:
  energises_title: "Energises me"
  energises:
    - "Complex problems → elegant solutions"
    - "Mastery and continuous learning; diving deep, building expertise"
    - "Measurable, merit-based impact; tangible outcomes tied to effort"
    - "Autonomy within clear guardrails"
    - "Competent, direct collaborators who value logic over sentiment"
    - "Fixing broken systems and inefficient processes"
    - "Growing practitioners: teaching frameworks and reasoning, not just tools"
    - "Enabling impact at scale through others' capability"
  drains_title: "Drains me"
  drains:
    - "Bureaucracy, ambiguous requirements, slow decisions"
    - "People who take criticism personally"
    - "Shallow work or constant task-switching without mastery"
    - "Emotional labour over directness"
    - "Vague or moving goalposts"
    - "Extended high-stimulation social environments"
  optimising_title: "What I'm optimising for"
  optimising:
    - title: "Autonomy"
      subtitle: "Clear goals, trust to execute"
    - title: "Technical excellence"
      subtitle: "Hard problems, deepening expertise"
    - title: "Clear communication"
      subtitle: "Directness valued over soft skills"
    - title: "Impact at scale"
      subtitle: "Measurable outcomes; amplify team value"
    - title: "Stability"
      subtitle: "Predictable direction, time to build mastery"
    - title: "Growing people"
      subtitle: "Understand their strengths and motivations"

working_with_me:
  feedback_give_title: "Giving feedback to me"
  feedback_give:
    - "Direct, logical, specific — \"that approach won't work because...\" is useful"
    - "Don't soften it or wrap in praise first. Clarity is kind"
    - "Assume I want to improve; I treat feedback as data, not judgment"
    - "Challenge on logic, not on \"should have asked first\""
  feedback_how_title: "How I give feedback"
  feedback_how:
    - "Direct and fact-based; assumes people want to improve"
    - "Delivery can land as harsh if I don't add context — assume good intent"
    - "Calibrate for self-critical people: feedback should open doors, not close them"
  manage_title: "How to manage me well"
  manage:
    - "High autonomy with clear goals — tell me what success looks like, let me figure out how"
    - "Direct, logical, specific feedback — no softening or wrapping in praise"
    - "Assume competence; challenge on logic"
    - "Value directness — don't ask for opinion then reject honesty"
    - "Regular touchpoints to align, but respect my time; minimal interruptions"
    - "If I'm quiet under pressure, it means I'm resetting — not disengaging"
  impression_title: "First impression vs reality"
  impression_label: "First impression"
  impression_text: "Serious, direct, possibly intense. Straightforward style misread as inflexibility."
  reality_label: "Reality"
  reality_text: "Cares deeply about getting things right. Criticism is investment. Listens — will say honestly if something won't work."
  impression_note: "Doesn't perform warmth. Understands emotional dynamics but prioritises directness over managing them."
  pitfalls_title: "Self-aware pitfalls"
  pitfalls:
    - strong: "High expectations → projecting."
      text: "Can be disappointed quickly. Correct for it by giving people space to grow at their own pace."
    - strong: "Action-oriented → missing emotional cues."
      text: "Moves fast on outcomes; checks in explicitly so encouragement doesn't get lost alongside correction."
    - strong: "Over-weighted by past experience."
      text: "Trusts what's worked before — deliberately, so it doesn't become a blind spot to new context."
    - strong: "Over-protective of own ideas."
      text: "Can be dismissive of weak challenges. Takes the longer view before pushing back."
    - strong: "Directness without context reads as harsh."
      text: "If feedback lands badly, it's likely delivery, not intent. Worth naming."
    - strong: "Lack of check-ins reads as indifference."
      text: "It actually means trust. Be explicit about this — it doesn't come naturally."
    - strong: "Stepping on toes at scale."
      text: "Need to bring people along, not steamroll. Talk to people doing related work first."
    - strong: "Perfectionism and self-doubt."
      text: "Sets impossibly high standards for self. Holds the bar without letting it become self-punishing."

about_you:
  title: "What I'd like to know about you"
  subtitle: "This page is mostly about me — that's the nature of a working manual. But collaboration is two-way. These are the things I'd genuinely want to understand about a potential teammate or manager."
  questions:
    - question: "How does your team handle disagreement when there's no clear right answer?"
      why: "Signals whether directness and dissent are genuinely welcome, or just tolerated on the surface."
      link_tab: "values"
      link_label: "→ Values: Truth over politics"
    - question: "What does a typical week look like — ratio of deep work to meetings?"
      why: "Extended high-stimulation social environments drain me. Focus time isn't a perk — it's how good work gets done."
      link_tab: "energisers"
      link_label: "→ Energisers: Drains me"
    - question: "How is technical debt treated: a cost to actively manage, or an accepted normal?"
      why: "Quantity over quality is a hard exit. The answer here usually reveals how engineering is actually valued."
      link_tab: "values"
      link_label: "→ Values: Red flags"
    - question: "When someone on the team ships something great, what happens?"
      why: "Tells me whether technical depth is genuinely celebrated or just expected and invisible."
      link_tab: "values"
      link_label: "→ Values: Green flags"
    - question: "What's the last hard call leadership made, and how was it communicated?"
      why: "I work best where leadership reasons through trade-offs openly — not by consensus or committee."
      link_tab: "values"
      link_label: "→ Values: Green flags"
    - question: "How do you give feedback when something isn't working?"
      why: "Direct, specific feedback is how I improve. Feedback-avoidance is a red flag."
      link_tab: "working-with-me"
      link_label: "→ Working with me: Feedback"
