manifesto:
  quote: "Angetrieben durch das Lösen schwieriger Probleme."
  subtitle: "Das Leben so gestalten, dass die Zeit für echte Arbeit maximiert und Politik sowie Konsensbildung minimiert wird."
  chips:
    - "ISTP"
    - "Directing Reformer"

personality:
  section_label: "Persönlichkeit auf einen Blick"
  attribution: "Insights Discovery · Color Dynamics · ISTP"
  traits:
    - label: "Analytisch"
      description: "Strukturiert, qualitätsorientiert. Denkt in Systemen und Standards. Schätzt Prozessintegrität und gründliches Denken."
      color: "#3b82f6"
      text_color: "#2563eb"
    - label: "Entschlossen"
      description: "Direkt und handlungsorientiert. Trifft schwierige Entscheidungen, wenn die Logik klar ist."
      color: "#ef4444"
      text_color: "#dc2626"
    - label: "Fürsorglich"
      description: "Leise engagiert. Zeigt Fürsorge durch Zuverlässigkeit und ehrliches Feedback, nicht durch ständige Verfügbarkeit."
      color: "#22c55e"
      text_color: "#16a34a"
    - label: "Nicht expressiv"
      description: "Bevorzugt Tiefe und Direktheit gegenüber sozialem Auftreten. Kein Small Talk um des Small Talks willen."
      color: "#d1d5db"
      text_color: "#9ca3af"

tabs:
  how_i_work: "Arbeitsweise"
  values: "Werte"
  energisers: "Motivatoren"
  working_with_me: "Zusammenarbeit"

how_i_work:
  cards:
    - title: "Teamdynamik"
      accent: "blue"
      points:
        - "Optimal in Teams von 5–15 Personen: groß genug für interessante Probleme, klein genug für gemeinsame Standards"
        - "Natürliche Rolle: Problemlöser + Standardsetzer + stiller Unterstützer"
        - "Kollaborativ bei schwierigen Problemen, nicht konsensorientiert — arbeitet am besten mit 1–2 Peers zum Debattieren"
        - "Zeigt Fürsorge durch Zuverlässigkeit und ehrliches Feedback, nicht durch konstante Wärme"
      link_tab: "values"
      link_label: "→ verbindet mit Werte: Leistungsbasiert"
    - title: "Unter Druck"
      accent: "red"
      points:
        - "Moderater Druck schärft den Fokus — Stress klärt Denken und Priorisierung"
        - "Extremer Druck: kurzer Rückzug zum Reset, dann wieder engagieren. Stille ≠ Aufgeben"
        - "Benötigt: klare Eskalationswege, Autonomie für schnelle Entscheidungen, minimalen Prozessaufwand in der Krise"
        - "Benötigt danach Erholungszeit zum Aufladen"
      link_tab: "working-with-me"
      link_label: "→ verbindet mit Führung"
    - title: "Umgang mit Ambiguität"
      accent: "blue"
      points:
        - "Versucht sofort einzugrenzen — stellt klärende Fragen, schlägt Strukturen vor, fixiert Einschränkungen"
        - "Braucht Leitplanken: völlige Offenheit ist lähmend; definierter Problemraum auch wenn Lösung offen"
        - "Kann ungeduldig mit Exploration wirken — bevorzugt 'Was sollten wir testen' statt offenes Brainstorming"
      link_tab: "energisers"
      link_label: "→ verbindet mit Motivatoren: Was mich lähmt"
    - title: "Stakeholder"
      accent: "green"
      points:
        - "Direkt und effizient: sagt Stakeholdern was ich denke und warum; tut nicht so als ob eine schlechte Lösung gut wäre"
        - "Erschöpft langfristig — braucht technische Arbeit und Stille zum Aufladen"
        - "Versteht erst welches Problem sie lösen wollen, dann findet gemeinsame Interessen bevor er widerspricht"
      link_tab: "working-with-me"
      link_label: "→ verbindet mit Erster Eindruck"
  leader:
    title: "Als Führungskraft"
    col1:
      - "Setzt klare Erwartungen; macht Kompromisse und Umfang explizit"
      - "Setzt sich vehement für Teamerfolge ein; lässt gute Arbeit nicht unbemerkt bleiben"
      - "Bleibt im Bereich hands-on — führt durch technisches Urteilsvermögen, nicht durch reine Delegation"
    col2:
      - "Ordnet Menschen Problemen zu basierend auf dem was sie wirklich motiviert"
      - "Schützt Fokuszeit; beseitigt aktiv Hindernisse: Meetings, vage Roadmaps, Politik"
      - "Nicht: Motivationsredner, Konfliktglätter, Kulturaufbauer durch Ausflüge"
    link_tab: "working-with-me"
    link_label: "→ verbindet mit Schwachstellen: Direktheit ohne Kontext"

values:
  non_negotiables_title: "Nicht verhandelbar"
  non_negotiables_note: "Eine Kultur die Optik über Wahrheit stellt, ist ein harter Ausstiegsgrund. Leistung wird an Ergebnissen gemessen, nicht an Betriebszugehörigkeit."
  pills:
    - "Wahrheit über Politik"
    - "Leistungsbasierter Aufstieg"
    - "Klare Erwartungen"
    - "Autonomie zum Richtigen tun"
    - "In Praktiker investieren"
    - "Wirkung im Maßstab"
  green_flags_title: "Positive Zeichen"
  green_flags:
    - "Technische Tiefe wird geschätzt; gute Lösungen werden gefeiert"
    - "'Hier ist das Ziel, finde den Weg' — Autonomie mit klaren Zielen"
    - "Führung diskutiert Kompromisse offen, entscheidet nicht per Konsens"
    - "Offenes Feedback; Meinungsverschiedenheiten willkommen; Direktheit geschätzt"
    - "Hoher Qualitätsanspruch; Führung unterscheidet umkehrbare von nicht umkehrbaren Entscheidungen"
    - "Servant Leadership: Führungskräfte investieren in die Fähigkeiten und Karriere ihrer Mitarbeiter"
  red_flags_title: "Warnsignale"
  red_flags:
    - "Manager die keine Meinungsverschiedenheiten aushalten"
    - "Entscheidung per Komitee; ständige Neuverhandlung des Umfangs"
    - "Quantität über Qualität; technische Schulden als Normal"
    - "Feedback-Vermeidung; alle sind unterstützend statt ehrlich"
    - "Vage Erwartungen; undefinierte Erfolgskennzahlen"
  compat_title: "Wie wir zusammenarbeiten könnten"
  compat_subtitle: "Dinge die ich als wichtig für eine gute Zusammenarbeit erkannt habe — für beide Seiten. Keine Anforderungsliste, nur Signale die es wert sind im Gespräch zu erkunden."
  compat_items:
    - "Technische Tiefe wird geschätzt und gefeiert"
    - "Autonomie mit klaren Zielen — 'finde den Weg' Kultur"
    - "Führung diskutiert Kompromisse offen"
    - "Direktes Feedback willkommen; Meinungsverschiedenheiten sind in Ordnung"
    - "Hoher Qualitätsanspruch über reine Geschwindigkeit"
    - "Leistungsbasiert — Ergebnisse über Beziehungen"
    - "Investition in die Fähigkeiten und Entwicklung von Praktikern"
    - "Messbare Wirkung — kein Theater"
  compat_labels:
    - "Schau was resoniert — es gibt keine richtige Antwort."
    - "Ein Ausgangspunkt."
    - "Einige Überschneidungen."
    - "Ein Gespräch wert."
    - "Vernünftige Übereinstimmung."
    - "Gute Ausrichtung bei wichtigen Dingen."
    - "Klingt nach einer guten Übereinstimmung."
    - "Starke Überschneidung — lass uns reden."
    - "Starke Überschneidung — lass uns reden."

energisers:
  energises_title: "Was mich antreibt"
  energises:
    - "Komplexe Probleme → elegante Lösungen"
    - "Meisterschaft und kontinuierliches Lernen; tief eintauchen, Expertise aufbauen"
    - "Messbare, leistungsbasierte Wirkung; greifbare Ergebnisse die mit Aufwand zusammenhängen"
    - "Autonomie innerhalb klarer Leitplanken"
    - "Kompetente, direkte Kollaborateure die Logik über Gefühl stellen"
    - "Kaputte Systeme und ineffiziente Prozesse reparieren"
    - "Praktiker entwickeln: Frameworks und Denkweise lehren, nicht nur Werkzeuge"
    - "Wirkung im Maßstab durch die Fähigkeiten anderer ermöglichen"
  drains_title: "Was mich lähmt"
  drains:
    - "Bürokratie, unklare Anforderungen, langsame Entscheidungen"
    - "Menschen die Kritik persönlich nehmen"
    - "Oberflächliche Arbeit oder ständiges Aufgabenwechseln ohne Meisterschaft"
    - "Emotionale Arbeit statt Direktheit"
    - "Vage oder sich bewegende Ziele"
    - "Längere soziale Hochstimulationsumgebungen"
  optimising_title: "Wofür ich optimiere"
  optimising:
    - title: "Autonomie"
      subtitle: "Klare Ziele, Vertrauen zur Ausführung"
    - title: "Technische Exzellenz"
      subtitle: "Schwierige Probleme, Expertise vertiefen"
    - title: "Klare Kommunikation"
      subtitle: "Direktheit über Soft Skills"
    - title: "Wirkung im Maßstab"
      subtitle: "Messbare Ergebnisse; Teamwert verstärken"
    - title: "Stabilität"
      subtitle: "Vorhersehbare Richtung, Zeit für Meisterschaft"
    - title: "Menschen entwickeln"
      subtitle: "Stärken und Motivationen verstehen"

working_with_me:
  feedback_give_title: "Mir Feedback geben"
  feedback_give:
    - "Direkt, logisch, spezifisch — 'Dieser Ansatz funktioniert nicht, weil...' ist nützlich"
    - "Nicht abmildern oder in Lob verpacken. Klarheit ist freundlich"
    - "Annahme: ich will mich verbessern; ich behandle Feedback als Daten, nicht als Urteil"
    - "Logik herausfordern, nicht 'hätte zuerst fragen sollen'"
  feedback_how_title: "Wie ich Feedback gebe"
  feedback_how:
    - "Direkt und sachlich; geht davon aus dass Menschen sich verbessern wollen"
    - "Lieferung kann hart ankommen ohne zusätzlichen Kontext — gute Absicht annehmen"
    - "Auf selbstkritische Menschen kalibriert: Feedback soll Türen öffnen, nicht schließen"
  manage_title: "Wie man mich gut führt"
  manage:
    - "Hohe Autonomie mit klaren Zielen — sag mir wie Erfolg aussieht, lass mich den Weg finden"
    - "Direktes, logisches, spezifisches Feedback — kein Abmildern oder Einwickeln in Lob"
    - "Kompetenz annehmen; Logik herausfordern"
    - "Direktheit schätzen — nicht nach Meinung fragen und dann Ehrlichkeit ablehnen"
    - "Regelmäßige Abstimmung, aber Zeit respektieren; minimale Unterbrechungen"
    - "Wenn ich unter Druck still bin bedeutet das Reset — nicht Rückzug"
  impression_title: "Erster Eindruck vs. Realität"
  impression_label: "Erster Eindruck"
  impression_text: "Ernst, direkt, möglicherweise intensiv. Direkter Stil wird als Unflexibilität missverstanden."
  reality_label: "Realität"
  reality_text: "Liegt tief daran die Dinge richtig zu machen. Kritik ist Investition. Hört zu — sagt ehrlich wenn etwas nicht funktioniert."
  impression_note: "Gibt keine Wärme vor. Versteht emotionale Dynamiken, priorisiert aber Direktheit über deren Management."
  pitfalls_title: "Selbstbewusste Schwachstellen"
  pitfalls:
    - strong: "Hohe Erwartungen → Projektion."
      text: "Kann schnell enttäuscht sein. Gleicht das aus, indem er Menschen Raum lässt in eigenem Tempo zu wachsen."
    - strong: "Handlungsorientiert → emotionale Signale übersehen."
      text: "Bewegt sich schnell auf Ergebnisse zu; fragt gezielt nach, damit Ermutigung neben der Korrektur nicht untergeht."
    - strong: "Zu stark von vergangenen Erfahrungen geprägt."
      text: "Vertraut auf Bewährtes — bewusst, damit daraus kein blinder Fleck für neuen Kontext wird."
    - strong: "Zu beschützend gegenüber eigenen Ideen."
      text: "Kann schwache Einwände zu schnell abtun. Nimmt die langfristige Perspektive ein, bevor er widerspricht."
    - strong: "Direktheit ohne Kontext wirkt hart."
      text: "Wenn Feedback schlecht ankommt liegt es wahrscheinlich an der Lieferung, nicht der Absicht. Lohnt sich zu benennen."
    - strong: "Fehlende Check-ins wirken wie Gleichgültigkeit."
      text: "Es bedeutet eigentlich Vertrauen. Das explizit machen — es kommt nicht von selbst."
    - strong: "Im Maßstab anderen auf die Zehen treten."
      text: "Menschen mitnehmen, nicht überrollen. Erst mit Menschen sprechen die an verwandten Dingen arbeiten."
    - strong: "Perfektionismus und Selbstzweifel."
      text: "Setzt unmöglich hohe Standards für sich selbst. Hält die Messlatte, ohne dass sie sich selbst bestraft."

about_you:
  title: "Was ich gerne über dich wissen würde"
  subtitle: "Diese Seite dreht sich hauptsächlich um mich — das liegt in der Natur eines Arbeitshandbuchs. Aber Zusammenarbeit funktioniert in beide Richtungen. Das sind die Dinge die ich wirklich über einen potenziellen Teamkollegen oder Manager verstehen möchte."
  questions:
    - question: "Wie geht dein Team mit Meinungsverschiedenheiten um wenn es keine klare richtige Antwort gibt?"
      why: "Zeigt ob Direktheit und Dissens wirklich willkommen sind oder nur oberflächlich toleriert werden."
      link_tab: "values"
      link_label: "→ Werte: Wahrheit über Politik"
    - question: "Wie sieht eine typische Woche aus — Verhältnis von Deep Work zu Meetings?"
      why: "Lange hochstimulative soziale Umgebungen erschöpfen mich. Fokuszeit ist kein Vorteil — so entsteht gute Arbeit."
      link_tab: "energisers"
      link_label: "→ Motivatoren: Was mich lähmt"
    - question: "Wie wird technische Schulden behandelt: als aktiv zu managende Kosten oder als akzeptierter Normalzustand?"
      why: "Quantität über Qualität ist ein harter Ausstiegsgrund. Die Antwort verrät meist wie Engineering wirklich bewertet wird."
      link_tab: "values"
      link_label: "→ Werte: Warnsignale"
    - question: "Was passiert wenn jemand im Team etwas Großartiges liefert?"
      why: "Zeigt ob technische Tiefe wirklich gefeiert oder nur erwartet und unsichtbar gemacht wird."
      link_tab: "values"
      link_label: "→ Werte: Positive Zeichen"
    - question: "Was war die letzte schwierige Entscheidung die die Führung getroffen hat und wie wurde sie kommuniziert?"
      why: "Ich arbeite am besten wo Führung Kompromisse offen durchdenkt — nicht per Konsens oder Komitee."
      link_tab: "values"
      link_label: "→ Werte: Positive Zeichen"
    - question: "Wie gibst du Feedback wenn etwas nicht funktioniert?"
      why: "Direktes, spezifisches Feedback ist wie ich mich verbessere. Feedback-Vermeidungskultur ist ein Warnsignal."
      link_tab: "working-with-me"
      link_label: "→ Zusammenarbeit: Feedback"
