how_i_work:
  cards:
    - title: "團隊動態"
      accent: "blue"
      points:
        - "最適合5至15人團隊：夠大以面對有趣問題，夠小以維持共同標準"
        - "自然角色：解決問題者＋標準制定者＋默默支持者"
        - "針對難題時樂於合作，但不追求共識——最適合與1至2位同儕辯論"
        - "透過可靠性同誠實回饋表達關心，而非持續嘅溫暖或陪伴"
      link_tab: "values"
      link_label: "→ 連結至價值觀：以成果為本"
    - title: "壓力下"
      accent: "red"
      points:
        - "適度壓力令思路更清晰——壓力有助釐清優先次序"
        - "極端壓力：短暫退出重整，然後重新投入。沉默≠放棄"
        - "需要：清晰嘅升級路徑、快速決定嘅自主權、危機中減少流程"
        - "之後需要休息時間充電"
      link_tab: "working-with-me"
      link_label: "→ 連結至如何管理我"
    - title: "處理模糊性"
      accent: "blue"
      points:
        - "即時嘗試收窄——問澄清問題、提出結構、鎖定限制條件"
        - "需要一些護欄：完全開放令人癱瘓；即使方案未定，也需要明確嘅問題範圍"
        - "可能顯得對探索不耐煩——偏好「我認為我們應該測試什麼」而非開放式腦力激盪"
      link_tab: "energisers"
      link_label: "→ 連結至消耗我嘅事"
    - title: "利益相關者"
      accent: "green"
      points:
        - "直接高效：告訴利益相關者我嘅想法同原因；唔會假裝壞方案係好嘅"
        - "長期會消耗精力——需要技術工作同獨處時間充電"
        - "會先了解對方想解決什麼問題，搵到共同利益先至提出反對"
      link_tab: "working-with-me"
      link_label: "→ 連結至我嘅第一印象"
  leader:
    title: "作為領導者"
    col1:
      - "設定清晰期望；明確說明取捨同範圍"
      - "積極為團隊爭取認可；唔會讓好工作被忽視"
      - "保持在領域內親力親為——透過技術判斷而非純粹委派來領導"
    col2:
      - "根據真正驅動每個人嘅動力來分配問題"
      - "保護專注時間；主動清除障礙：會議、模糊路線圖、政治"
      - "不是：激勵演講者、衝突調解者、靠外出活動建立文化嘅人"
    link_tab: "working-with-me"
    link_label: "→ 連結至自我覺察嘅弱點"

