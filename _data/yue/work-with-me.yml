working_with_me:
  feedback_give_title: "給我回饋嘅方式"
  feedback_give:
    - "直接、有邏輯、具體——「那個方法行唔通，因為......」係有用嘅"
    - "唔好軟化或先包裝正面。清晰係善意"
    - "假設我想進步；我將回饋視為數據，而非評判"
    - "針對邏輯提出挑戰，而非「應該先問」"
  feedback_how_title: "我如何給回饋"
  feedback_how:
    - "直接、以事實為基礎；假設人們想進步"
    - "冇加返context嘅話，表達方式可能聽起來嚴厲——請假設好意"
    - "對自我批評嘅人會特別調整：回饋要開門，唔可以關門"
  manage_title: "如何有效管理我"
  manage:
    - "高度自主配合清晰目標——告訴我成功係什麼樣子，讓我自己想方法"
    - "直接、有邏輯、具體嘅回饋——唔好軟化或包裝讚美"
    - "假設能力；針對邏輯提出挑戰"
    - "重視直接——唔好問意見然後拒絕誠實"
    - "定期對齊討論，但尊重我嘅時間；減少打擾"
    - "如果我在壓力下沉默，係在重整——而非脫離"
  impression_title: "第一印象與現實"
  impression_label: "第一印象"
  impression_text: "嚴肅、直接、可能有點強烈。直接嘅風格被誤讀為固執或唔願意聆聽。"
  reality_label: "現實"
  reality_text: "非常在乎將事情做好。批評係投資。願意聆聽——但會誠實地說某件事行唔通。"
  impression_note: "唔表演溫暖。了解情感動態，但將直接置於管理情感之上。"
  pitfalls_title: "自我覺察嘅弱點"
  pitfalls:
    - strong: "高期望→投射。"
      text: "可能很快失望。會刻意給予他人按自己步伐成長嘅空間。"
    - strong: "以行動為導向→錯過情感線索。"
      text: "快速推進成果；會刻意留意，唔好淨係糾正而漏咗鼓勵。"
    - strong: "過於依賴過去嘅經驗。"
      text: "相信以前行得通嘅方法——但係刻意咁樣做，唔畀佢變成對新處境嘅盲點。"
    - strong: "對自己嘅想法過於保護。"
      text: "可能會太快否定弱嘅質疑。反駁之前，會先放遠啲睇。"
    - strong: "缺乏語境嘅直接聽起來嚴厲。"
      text: "如果回饋效果不好，很可能係表達方式，而非意圖。值得點明。"
    - strong: "缺乏跟進被視為漠不關心。"
      text: "其實係信任。要明確說明——這唔係自然而然嘅。"
    - strong: "在規模上踩到別人嘅腳趾。"
      text: "需要帶動人們，而非壓倒。先同做相關工作嘅人傾。"
    - strong: "完美主義同自我懷疑。"
      text: "為自己設定唔可能達到嘅高標準。守住標準，但唔會用嚟懲罰自己。"

about_you:
  title: "我想了解你嘅事"
  subtitle: "呢頁主要係關於我——咁係工作手冊嘅本質。但合作係雙向嘅。以下係我真正希望了解潛在隊友或上司嘅事。"
  questions:
    - question: "當冇明確正確答案時，你嘅團隊點樣處理分歧？"
      why: "反映直接表達同異議係真正受歡迎，定係只係表面容忍。"
      link_tab: "values"
      link_label: "→ 價值觀：真相高於政治"
    - question: "典型嘅一週係點——深度工作同會議嘅比例係幾多？"
      why: "長時間高刺激社交環境消耗我嘅精力。專注時間唔係福利——係完成好工作嘅方式。"
      link_tab: "energisers"
      link_label: "→ 動力來源：消耗我嘅事"
    - question: "技術債務係點對待嘅：主動管理嘅成本，定係被接受嘅正常狀態？"
      why: "數量高於質量係離開嘅理由。呢個答案通常反映工程實際上係幾受重視。"
      link_tab: "values"
      link_label: "→ 價值觀：警示跡象"
    - question: "當團隊有人做出好嘢時，會發生什麼事？"
      why: "反映技術深度係真正受慶祝，定係只係被期待而無人關注。"
      link_tab: "values"
      link_label: "→ 價值觀：好跡象"
    - question: "領導層最近一次作出嘅艱難決定係什麼，又係點樣傳達俾團隊？"
      why: "我喺領導層公開討論取捨嘅環境中表現最好——而非靠共識或委員會決定。"
      link_tab: "values"
      link_label: "→ 價值觀：好跡象"
    - question: "當某件事唔work時，你係點樣給予回饋嘅？"
      why: "直接、具體嘅回饋係我進步嘅方式。迴避回饋嘅文化係警示跡象。"
      link_tab: "working-with-me"
      link_label: "→ 同我合作：回饋"
