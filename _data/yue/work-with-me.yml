manifesto:
  quote: "靠解決難題而充滿動力。"
  subtitle: "盡量將時間用於實際工作，減少政治同共識建立。"
  chips:
    - "ISTP"
    - "Directing Reformer"

personality:
  section_label: "性格概覽"
  attribution: "Insights Discovery · Color Dynamics · ISTP"
  traits:
    - label: "分析型"
      description: "有系統、注重品質。以制度同標準思考，重視流程嚴謹性。"
      color: "#3b82f6"
      text_color: "#2563eb"
    - label: "決斷型"
      description: "直接、以行動為導向。邏輯清晰時能果斷作出艱難決定。"
      color: "#ef4444"
      text_color: "#dc2626"
    - label: "關懷型"
      description: "默默投入。透過可靠性同誠實嘅回饋表達關心，而非表演式溫暖。"
      color: "#22c55e"
      text_color: "#16a34a"
    - label: "非表達型"
      description: "偏好深度同直接，而非社交表演。唔係為閒聊而閒聊。"
      color: "#d1d5db"
      text_color: "#9ca3af"

tabs:
  how_i_work: "工作方式"
