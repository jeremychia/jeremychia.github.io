---
layout: default
---


<div class="container mx-auto">
  <div id="post" class="prose max-w-[75ch] prose-neutral mx-auto pb-10 pt-20 lg:pt-[90px] lg:pb-20">
    <h1 class="text-left text-2xl font-bold md:text-5xl text-black">{{page.title}}</h1>

    {% if page.links or page.video %}
    <p class="action-links">
      {% if page.video %}<a class="action-link" href="{{ page.video }}">Watch the talk on YouTube &rarr;</a>{% endif %}
      {% for link in page.links %}<a class="action-link" href="{{ link.url }}">{{ link.title }} &rarr;</a>{% endfor %}
    </p>
    {% endif %}

    <img src="{{page.image | relative_url}}" alt="{{ page.image_alt | default: page.title }}">

    <div class="my-6">
      {{content}}
    </div>

    <div class="mx-auto py-8">
      {% include sharing.html %}
    </div>

  </div>
</div>
