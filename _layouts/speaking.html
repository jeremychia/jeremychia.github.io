---
layout: default
---

<section class="container mx-auto px-4 py-16">
  <div class="text-center mb-16">
    <h1 class="text-4xl font-bold mb-4">{{ page.title }}</h1>
    <p class="text-gray-600 text-lg">{{ page.description }}</p>
  </div>

  <div class="mb-16">
    <h2 class="text-3xl font-bold mb-8 text-center md:text-left">Talks</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-16">
      {% for talk in site.speaking %}
      {% include speaking_card.html talk=talk %}
      {% endfor %}
    </div>
  </div>

  <div class="mb-16">
    <h2 class="text-3xl font-bold mb-8 text-center md:text-left">Publications</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-16">
      {% for publication in site.publications %}
      {% include publication_card.html publication=publication %}
      {% endfor %}
    </div>
  </div>
</section>
